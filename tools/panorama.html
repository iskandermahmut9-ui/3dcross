<!DOCTYPE HTML>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D\CROSS | Panorama Viewer</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        body, html {
            height: 100%; margin: 0; padding: 0;
            font-family: 'Manrope', sans-serif;
            background-color: #0a0a0a; color: white;
            overflow: hidden;
        }

        /* HEADER */
        header {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            padding: 0 40px; display: flex; justify-content: space-between; align-items: center;
            background-color: rgba(10, 10, 10, 0.9); backdrop-filter: blur(10px);
            border-bottom: 1px solid #333; z-index: 100; box-sizing: border-box;
        }
        .logo { font-weight: 600; font-size: 1.5rem; letter-spacing: 2px; text-transform: uppercase; text-decoration: none; color: white; display: flex; align-items: center; }
        .logo-slash { font-weight: 800; margin: 0 2px; color: #fff; }
        .logo-sub { opacity: 0.5; margin-left: 10px; font-weight: 300; font-size: 1rem; }
        
        .back-btn {
            text-decoration: none; color: #aaa; border: 1px solid #333; padding: 8px 20px;
            text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; transition: 0.3s;
        }
        .back-btn:hover { background: #fff; color: #000; border-color: #fff; }

        /* ПЛЕЕР */
        #panorama { width: 100%; height: 100vh; z-index: 1; }

        /* ЗОНА ЗАГРУЗКИ (DRAG & DROP) */
        .upload-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #0a0a0a; z-index: 50; transition: 0.3s;
        }
        .upload-overlay.hidden { opacity: 0; pointer-events: none; }

        .upload-box {
            border: 2px dashed #333; padding: 60px; text-align: center;
            border-radius: 0px; transition: 0.3s; cursor: pointer;
            width: 60%; max-width: 500px;
            background: rgba(255,255,255,0.02);
        }
        
        /* Подсветка при перетаскивании */
        .upload-box.drag-active {
            border-color: #fff; background: rgba(255,255,255,0.1); transform: scale(1.02);
        }
        .upload-box:hover { border-color: #888; background: #111; }
        
        .upload-icon { font-size: 50px; margin-bottom: 20px; opacity: 0.8; }
        .upload-text { font-size: 1.4rem; text-transform: uppercase; font-weight: 600; letter-spacing: 2px; margin-bottom: 10px; }
        .upload-sub { font-size: 0.9rem; color: #666; line-height: 1.5; }

        #fileInput { display: none; }

        /* Кнопка "Загрузить другую" */
        .reload-btn {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            z-index: 20; background: rgba(0,0,0,0.6); border: 1px solid #555;
            color: white; padding: 12px 30px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem;
            display: none; transition: 0.3s; backdrop-filter: blur(5px);
        }
        .reload-btn:hover { background: white; color: black; border-color: white; }

        @media (max-width: 768px) {
            header { padding: 0 20px; }
            .logo-sub { display: none; }
            .upload-box { padding: 30px; width: 85%; }
            .upload-text { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">3D<span class="logo-slash">\</span>CROSS <span class="logo-sub">| PANORAMA</span></a>
        <a href="index.html" class="back-btn">На главную</a>
    </header>

    <div id="uploadOverlay" class="upload-overlay">
        <label for="fileInput" class="upload-box" id="dropZone">
            <div class="upload-icon">📥</div>
            <div class="upload-text">Перетащите сюда</div>
            <div class="upload-sub">или нажмите для выбора<br>JPG / PNG (Equirectangular 2:1)</div>
        </label>
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <div id="panorama"></div>
    
    <div id="reloadBtn" class="reload-btn" onclick="resetViewer()">Загрузить другую</div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const overlay = document.getElementById('uploadOverlay');
        const dropZone = document.getElementById('dropZone');
        const reloadBtn = document.getElementById('reloadBtn');
        let viewer;

        // --- 1. ФУНКЦИЯ ОБРАБОТКИ ФАЙЛА ---
        function handleFile(file) {
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const imageSrc = event.target.result;
                    
                    // Скрываем меню, показываем кнопку возврата
                    overlay.classList.add('hidden');
                    reloadBtn.style.display = 'block';

                    // Если плеер уже был, удаляем старый
                    if(viewer) { viewer.destroy(); }

                    // Запускаем Pannellum
                    viewer = pannellum.viewer('panorama', {
                        "type": "equirectangular",
                        "panorama": imageSrc,
                        "autoLoad": true,
                        "autoRotate": -2,     // Медленное вращение
                        "compass": false,
                        "showControls": true,
                        "theme": "dark",
                        "backgroundColor": [10, 10, 10]
                    });
                };
                reader.readAsDataURL(file);
            } else {
                alert("Пожалуйста, загрузите изображение (JPG или PNG)");
            }
        }

        // --- 2. КЛИК ПО КНОПКЕ ---
        fileInput.addEventListener('change', function(e) {
            handleFile(e.target.files[0]);
        });

        // --- 3. DRAG & DROP МАГИЯ ---
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // Подсветка зоны
        ['dragenter', 'dragover'].forEach(() => dropZone.classList.add('drag-active'));
        ['dragleave', 'drop'].forEach(() => dropZone.classList.remove('drag-active'));

        // Обработка "броска" файла
        document.body.addEventListener('drop', function(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFile(files[0]);
        });

        // --- 4. СБРОС ---
        function resetViewer() {
            overlay.classList.remove('hidden');
            reloadBtn.style.display = 'none';
            if(viewer) {
                viewer.destroy();
                viewer = null;
            }
            fileInput.value = '';
        }
    </script>

</body>
</html>
