<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D\CROSS | AI Planer</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="theme-color" content="#0a0a0a">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            background-color: #0a0a0a; 
            font-family: 'Manrope', sans-serif; 
            color: white; 
            overflow: hidden; 
        }
        
        /* HEADER */
        header {
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 70px;
            padding: 0 40px; 
            display: flex; justify-content: space-between; align-items: center;
            background-color: #0a0a0a; 
            border-bottom: 1px solid #333; 
            z-index: 100; 
            box-sizing: border-box;
        }
        
        .logo { 
            font-weight: 600; 
            font-size: 1.5rem; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            text-decoration: none; 
            color: white; 
            display: flex; align-items: center; 
        }
        
        .logo-slash { 
            font-weight: 800; 
            margin: 0 2px; 
            color: #fff; 
        }
        
        .logo-sub { 
            opacity: 0.5; 
            margin-left: 10px; 
            font-weight: 300; 
            font-size: 1rem; 
        }
        
        .back-btn {
            text-decoration: none; 
            color: #aaa; 
            border: 1px solid #333; 
            padding: 8px 20px;
            text-transform: uppercase; 
            font-size: 0.8rem; 
            letter-spacing: 1px; 
            transition: 0.3s;
        }
        
        .back-btn:hover { 
            background: #fff; 
            color: #000; 
            border-color: #fff; 
        }

        /* IFRAME */
        .app-frame {
            position: absolute; 
            top: 70px; 
            left: 0; 
            width: 100%; 
            height: calc(100% - 70px); 
            border: none;
            background-color: #0a0a0a;
        }

        @media (max-width: 768px) {
            header { padding: 0 20px; }
            .logo-sub { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">3D<span class="logo-slash">\</span>CROSS <span class="logo-sub">| AI PLANER</span></a>
        <a href="index.html" class="back-btn">На главную</a>
    </header>
    
    <iframe 
        src="https://iskandermahmut9-ai-planer.hf.space" 
        class="app-frame" 
        allow="camera; microphone; clipboard-read; clipboard-write;" 
        allowfullscreen>
    </iframe>

</body>
</html>
